<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>rrweb 录制与回放演示</title>
    <!-- 引入 rrweb-player 样式 -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/rrweb-player@latest/dist/style.css"
    />
    <!-- 引入 rrweb-player -->
    <script src="https://cdn.jsdelivr.net/npm/rrweb-player@latest/dist/index.js"></script>
    <!-- 引入 rrweb -->
    <script src="https://cdn.jsdelivr.net/npm/rrweb@latest/dist/rrweb.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto",
          "Oxygen", "Ubuntu", "Cantarell", "Fira Sans", "Droid Sans",
          "Helvetica Neue", sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        padding: 20px;
        background: #f5f5f5;
      }

      .App {
        max-width: 1200px;
        margin: 0 auto;
        background: white;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }

      .btn-wrap {
        margin-bottom: 20px;
        display: flex;
        gap: 10px;
      }

      button {
        padding: 10px 20px;
        font-size: 16px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        background: #007bff;
        color: white;
        transition: background 0.3s;
      }

      button:hover {
        background: #0056b3;
      }

      button:disabled {
        background: #ccc;
        cursor: not-allowed;
      }

      .textArea-wrap {
        margin-bottom: 20px;
      }

      textarea {
        width: 100%;
        padding: 10px;
        border: 1px solid #ddd;
        border-radius: 4px;
        font-size: 14px;
        font-family: inherit;
        resize: vertical;
      }

      #replay {
        width: 100%;
        min-height: 400px;
        border: 1px solid #ddd;
        border-radius: 4px;
        background: #f9f9f9;
      }
    </style>
  </head>
  <body>
    <div class="App">
      <div class="btn-wrap">
        <button id="startBtn">开始录制</button>
        <button id="replayBtn" disabled>回放</button>
      </div>
      <div class="textArea-wrap">
        <textarea rows="10" cols="50" placeholder="请输入..."></textarea>
      </div>
      <div id="replay"></div>
    </div>

    <script>
      // 状态管理
      let stopFn = null;
      let replayInstance = null;
      // We use a two-dimensional array to store multiple events array
      let eventsMatrix = [[]];
      let isPlaying = false;
      let cleanupTimer = null;
      const MAX_RECORD_TIME = 5 * 1000; // 5秒，单位：毫秒

      // DOM 元素
      const startBtn = document.getElementById("startBtn");
      const replayBtn = document.getElementById("replayBtn");
      const replayContainer = document.getElementById("replay");

      // 开始录制
      function start() {
        // 重置状态
        eventsMatrix = [[]];
        isPlaying = false;
        replayBtn.disabled = true;
        // 如果已有回放实例，先销毁
        if (replayInstance) {
          replayInstance.destroy();
          replayInstance = null;
          replayContainer.innerHTML = "";
        }

        // 开始录制
        stopFn = rrweb.record({
          emit(event, isCheckout) {
            // isCheckout 是一个标识，告诉你重新制作了快照
            // isCheckout is a flag to tell you the events has been checkout
            if (isCheckout) {
              eventsMatrix.push([]);
            }
            const lastEvents = eventsMatrix[eventsMatrix.length - 1];
            lastEvents.push(event);
          },
          checkoutEveryNms: 5 * 1000, // 每5s重新制作快照
          // checkoutEveryNth: 200, // 每 200 个 event 重新制作快照
        });

        // 更新按钮状态
        startBtn.disabled = true;
        replayBtn.disabled = false;
      }

      // 回放
      function replay() {
        if (!stopFn) return;

        // 停止录制
        stopFn();
        stopFn = null;

        isPlaying = true;
        startBtn.disabled = false;
        replayBtn.disabled = true;

        // 延迟创建回放实例，确保 DOM 已更新
        setTimeout(() => {
          if (replayContainer) {
            // 如果已有回放实例，先销毁
            if (replayInstance) {
              replayInstance.destroy();
            }

            // 创建新的回放实例
            replayInstance = new rrwebPlayer({
              target: replayContainer, // 可以自定义 DOM 元素
              // 配置项
              props: {
                events: eventsMatrix[eventsMatrix.length - 2].concat(
                  eventsMatrix[eventsMatrix.length - 1]
                ),
              },
            });
          }
        }, 100);
      }

      // 绑定事件
      startBtn.addEventListener("click", start);
      replayBtn.addEventListener("click", replay);
    </script>
  </body>
</html>
