<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>rrweb 录制与回放演示</title>
    <!-- 引入 rrweb-player 样式 -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/rrweb-player@latest/dist/style.css"
    />
    <!-- 引入 rrweb-player -->
    <script src="https://cdn.jsdelivr.net/npm/rrweb-player@latest/dist/index.js"></script>
    <!-- 引入 rrweb -->
    <script src="https://cdn.jsdelivr.net/npm/rrweb@latest/dist/rrweb.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto",
          "Oxygen", "Ubuntu", "Cantarell", "Fira Sans", "Droid Sans",
          "Helvetica Neue", sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        padding: 20px;
        background: #f5f5f5;
      }

      .App {
        max-width: 1200px;
        margin: 0 auto;
        background: white;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }

      .btn-wrap {
        margin-bottom: 20px;
        display: flex;
        gap: 10px;
      }

      button {
        padding: 10px 20px;
        font-size: 16px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        background: #007bff;
        color: white;
        transition: background 0.3s;
      }

      button:hover {
        background: #0056b3;
      }

      button:disabled {
        background: #ccc;
        cursor: not-allowed;
      }

      .textArea-wrap {
        margin-bottom: 20px;
      }

      textarea {
        width: 100%;
        padding: 10px;
        border: 1px solid #ddd;
        border-radius: 4px;
        font-size: 14px;
        font-family: inherit;
        resize: vertical;
      }

      #replay {
        width: 100%;
        min-height: 400px;
        border: 1px solid #ddd;
        border-radius: 4px;
        background: #f9f9f9;
      }
    </style>
  </head>
  <body>
    <div class="App">
      <div class="btn-wrap">
        <button id="startBtn">开始录制</button>
        <button id="replayBtn" disabled>回放</button>
      </div>
      <div class="textArea-wrap">
        <textarea rows="10" cols="50">这里是一个文本输入框</textarea>
      </div>
      <div id="replay"></div>
    </div>

    <script>
      // 状态管理
      let stopFn = null;
      let replayInstance = null;
      let events = [];
      let isPlaying = false;
      let cleanupTimer = null;
      const MAX_RECORD_TIME = 10 * 1000; // 10秒，单位：毫秒

      // DOM 元素
      const startBtn = document.getElementById("startBtn");
      const replayBtn = document.getElementById("replayBtn");
      const replayContainer = document.getElementById("replay");

      // 清理超过10秒的事件
      function cleanupOldEvents() {
        if (events.length === 0) return;

        // 始终保留第一个事件（初始DOM快照，type: 2）
        if (events.length <= 1) return;

        const firstEvent = events[0];
        const firstEventTimestamp = firstEvent.timestamp || 0;
        
        // 获取最后一个事件的时间戳（最新的时间）
        const lastEvent = events[events.length - 1];
        const lastEventTimestamp = lastEvent.timestamp || 0;
        
        // 如果录制时间少于10秒，不需要清理
        if (lastEventTimestamp - firstEventTimestamp <= MAX_RECORD_TIME) {
          return;
        }
        
        // 计算10秒前的时间戳（相对于第一个事件）
        // 只保留从 (lastEventTimestamp - 10秒) 到 lastEventTimestamp 之间的事件
        const cutoffTimestamp = lastEventTimestamp - MAX_RECORD_TIME;

        // 记录清理前的事件数量
        const beforeCount = events.length;

        // 过滤出最近10秒的事件（保留第一个事件）
        const recentEvents = events.filter((event, index) => {
          // 始终保留第一个事件（初始快照）
          if (index === 0) return true;
          // 对于其他事件，检查时间戳是否在最近10秒内
          // rrweb 的时间戳是相对于录制开始的相对时间，单位是毫秒
          const eventTimestamp = event.timestamp || 0;
          return eventTimestamp >= cutoffTimestamp;
        });

        // 更新 events 数组
        if (recentEvents.length === 0 || recentEvents[0] !== firstEvent) {
          events = [
            firstEvent,
            ...recentEvents.filter((e) => e !== firstEvent),
          ];
        } else {
          events = recentEvents;
        }

        // 记录清理信息
        const afterCount = events.length;
        const currentTime = lastEventTimestamp / 1000;
        if (beforeCount !== afterCount) {
          console.log(
            `清理事件: ${beforeCount} -> ${afterCount} 个（保留最近10秒，已录制 ${Math.round(currentTime)} 秒，cutoff: ${Math.round(cutoffTimestamp / 1000)} 秒）`
          );
        }
      }

      // 开始录制
      function start() {
        // 重置状态
        events = [];
        isPlaying = false;
        replayBtn.disabled = true;

        // 清除之前的清理定时器
        if (cleanupTimer) {
          clearInterval(cleanupTimer);
          cleanupTimer = null;
        }

        // 如果已有回放实例，先销毁
        if (replayInstance) {
          replayInstance.destroy();
          replayInstance = null;
          replayContainer.innerHTML = "";
        }

        // 开始录制
        stopFn = rrweb.record({
          emit(event) {
            // 将 event 存入 events 数组中
            events.push(event);
            console.log("rrweb event:", event);

            // 每次添加事件后立即清理超过10秒的事件
            cleanupOldEvents();
          },
        });

        // 定期清理旧事件（每1秒清理一次，确保及时清理超过10秒的数据）
        cleanupTimer = setInterval(() => {
          cleanupOldEvents();
        }, 1 * 1000);

        // 更新按钮状态
        startBtn.disabled = true;
        replayBtn.disabled = false;
      }

      // 回放
      function replay() {
        if (!stopFn) return;

        // 停止录制
        stopFn();
        stopFn = null;

        // 清除清理定时器
        if (cleanupTimer) {
          clearInterval(cleanupTimer);
          cleanupTimer = null;
        }

        // 最后一次清理，确保只保留最近10秒的数据
        cleanupOldEvents();

        isPlaying = true;
        startBtn.disabled = false;
        replayBtn.disabled = true;

        // 延迟创建回放实例，确保 DOM 已更新
        setTimeout(() => {
          if (replayContainer) {
            // 如果已有回放实例，先销毁
            if (replayInstance) {
              replayInstance.destroy();
            }

            // 创建新的回放实例
            replayInstance = new rrwebPlayer({
              target: replayContainer, // 可以自定义 DOM 元素
              // 配置项
              props: {
                events,
              },
            });
          }
        }, 100);
      }

      // 绑定事件
      startBtn.addEventListener("click", start);
      replayBtn.addEventListener("click", replay);
    </script>
  </body>
</html>
